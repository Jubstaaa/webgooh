# Runtime stack on the droplet (/opt/webgooh). The app is published only on
# localhost:3001; a shared Caddy in /opt/proxy terminates TLS (Cloudflare origin
# cert) and reverse-proxies to it, so this droplet can host other apps behind the
# same 80/443. The image is pulled from GHCR by the deploy workflow.
services:
    web:
        image: ghcr.io/jubstaaa/webgooh:latest
        container_name: webgooh
        restart: unless-stopped
        mem_limit: 256m
        # No third party has Portainer access to this app. If that changes, set
        # PORTAINER_TEAMS in .env beside this file and uncomment the two lines
        # below: the permission is then reapplied on every recreate.
        #
        # Doing it from the Portainer UI instead does NOT work — the permission
        # is keyed to the container ID, and `docker compose up -d` replaces the
        # container, so access silently disappears on the next deploy. Leaving
        # the label out entirely means administrator-only, which is the default
        # we want here.
        #
        # labels:
        #     io.portainer.accesscontrol.teams: ${PORTAINER_TEAMS}
        ports:
            - '127.0.0.1:3001:3000'
        environment:
            NODE_ENV: production
            NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
            PAYLOAD_SECRET: ${PAYLOAD_SECRET}
            DATABASE_URI: file:/app/data/webgooh.db
            REVALIDATION_SECRET: ${REVALIDATION_SECRET}
            PREVIEW_SECRET: ${PREVIEW_SECRET}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
            # Spaces credentials for Payload's S3 storage adapter. The bucket and
            # region are compiled in (src/payload.config.ts), not passed here.
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
        volumes:
            - /opt/webgooh/data:/app/data
            # Persist Next's optimized-image cache so it survives redeploys
            # (otherwise every deploy resets it and images go cold again).
            - /opt/webgooh/cache/images:/app/.next/cache/images
