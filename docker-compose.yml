# Runtime stack on the droplet (/opt/webgooh). The app is published only on
# localhost:3001; a shared Caddy in /opt/proxy terminates TLS (Cloudflare origin
# cert) and reverse-proxies to it, so this droplet can host other apps behind the
# same 80/443. The image is pulled from GHCR by the deploy workflow.
services:
    web:
        # The deploy job sets IMAGE_TAG to the commit SHA it releases; :latest moves
        # only after a healthy deploy, so the fallback is the last good release.
        image: ghcr.io/jubstaaa/webgooh:${IMAGE_TAG:-latest}
        container_name: webgooh
        restart: unless-stopped
        mem_limit: 256m
        # next-server binds the container's own address rather than loopback, so the
        # probe has to resolve $HOSTNAME: wget against 127.0.0.1 gets connection
        # refused. The name is doubled so Compose passes the variable through to the
        # shell inside the container instead of substituting the host's value. wget
        # here is BusyBox — -T is the timeout, the GNU long options do not exist.
        #
        # /api/health runs a Payload query: every page is served from Next's cache
        # and would keep answering while the database cannot be read.
        #
        # Docker does not restart an unhealthy container, and Beszel
        # cannot alert per container, so this fills the Health column and nothing
        # more: it surfaces "process alive but application wedged", which the
        # restart policy alone never catches. Deploys also wait on it
        # (`compose up --wait`) and roll back when it never passes.
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null -T 3 "http://$$HOSTNAME:3000/api/health" || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
            # Probe quickly while starting so a deploy's `compose up --wait` returns as
            # soon as the app answers instead of after the first 30s interval.
            start_interval: 2s
        # No third party has Portainer access to this app. If that changes, set
        # PORTAINER_TEAMS in .env beside this file and uncomment the two lines
        # below: the permission is then reapplied on every recreate.
        #
        # Doing it from the Portainer UI instead does NOT work — the permission
        # is keyed to the container ID, and `docker compose up -d` replaces the
        # container, so access silently disappears on the next deploy. Leaving
        # the label out entirely means administrator-only, which is the default
        # we want here.
        #
        # labels:
        #     io.portainer.accesscontrol.teams: ${PORTAINER_TEAMS}
        ports:
            - '127.0.0.1:3001:3000'
        environment:
            NODE_ENV: production
            # /api/health fails on a database without users (a wrong or empty
            # mount); CI's candidate boots on an empty database and sets false.
            HEALTH_REQUIRE_DATA: ${HEALTH_REQUIRE_DATA:-true}
            NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
            PAYLOAD_SECRET: ${PAYLOAD_SECRET}
            DATABASE_URI: file:/app/data/webgooh.db
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
            # Cloudflare Access application "Webgooh Panel": admin sign-in trusts
            # only a Cf-Access-Jwt-Assertion signed by this team for this audience.
            # Both are public identifiers (the team domain is in every /admin
            # redirect, the AUD is its kid parameter), so they default here and
            # the server's .env only needs them to point somewhere else.
            CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-https://webgooh.cloudflareaccess.com}
            CF_ACCESS_AUD: ${CF_ACCESS_AUD:-15bc585c2bd0dfa27e9be96ce0726b50c75a04b362e2e66585987c3f7f2b1ba0}
            # Spaces credentials for Payload's S3 storage adapter. The bucket and
            # region are compiled in (src/payload.config.ts), not passed here.
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
        # The host paths default to the droplet's; CI points them at temp
        # directories to boot the candidate image with this same file.
        volumes:
            - ${DATA_DIR:-/opt/webgooh/data}:/app/data
            # Only the image optimizer's cache persists across releases: re-encoding
            # every image on this 1 vCPU droplet is the expensive part. The data
            # cache and ISR pages stay in the container, so each release starts
            # from the database instead of entries a previous release wrote, which
            # may predate a schema change. Content is not baked into the image any
            # more, so losing them on a recreate costs one database read per page.
            #
            # The image creates /app/.next/cache owned by the app user (see the
            # Dockerfile), so this narrower mount no longer leaves a root-owned
            # parent behind, which cost acwistanbul.com a day of CMS edits on
            # 2026-07-26 while content was still baked in at build time.
            - ${IMAGE_CACHE_DIR:-/opt/webgooh/cache/images}:/app/.next/cache/images
