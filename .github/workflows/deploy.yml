name: CI / Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run type-check

    build:
        needs: check
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Fetch live DB for SSG prerender
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
                  scp -i ~/.ssh/id_ed25519 "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/opt/webgooh/data/webgooh.db" ./webgooh.db
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/jubstaaa/webgooh:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                      NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            packages: read
        steps:
            # The compose file is the repository's, not the server's. Without this
            # step `docker compose up` reads whatever happens to be on the droplet,
            # so the two drift the moment anyone edits either one — and the drift is
            # silent, because a deploy still succeeds against the stale copy.
            - uses: actions/checkout@v5
            - uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.DO_HOST }}
                  username: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  source: docker-compose.yml
                  target: /opt/webgooh
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DO_HOST }}
                  username: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  envs: GHCR_TOKEN,GHCR_USER
                  script: |
                      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                      cd /opt/webgooh
                      docker compose pull
                      docker compose up -d
                      docker image prune -f
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
