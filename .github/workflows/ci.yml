name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Type check
              run: bun run type-check

            - name: Build
              run: bun run build
              env:
                  PAYLOAD_SECRET: ci-placeholder-secret
                  DATABASE_URI: file:./webgooh.db
                  NEXT_PUBLIC_SITE_URL: https://www.webgooh.com

    docker:
        needs: quality
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  tags: webgooh:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
