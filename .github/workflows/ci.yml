name: CI

on:
    pull_request:
    # deploy.yml runs the same gate before every release. Only the two build-time
    # values are passed in, so the deploy's SSH secrets never reach this job.
    workflow_call:
        secrets:
            NEXT_PUBLIC_TURNSTILE_SITE_KEY:
                required: true
            NEXT_PUBLIC_SITE_URL:
                required: true

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    IMAGE: ghcr.io/jubstaaa/webgooh

jobs:
    check:
        # A push to main is a merged PR: the ruleset requires branches to be up
        # to date, so this job already passed on exactly that tree. A manual or
        # Dependabot-dispatched deploy (workflow_dispatch) runs it again.
        if: github.event_name != 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # gitleaks scans every commit, not just the newest one: a
                  # secret added and removed inside one PR stays in history.
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            # Dead files, exports and dependencies (knip.json), copy-paste above 3 %
            # (.jscpd.json), and import cycles, orphans and dev-only imports in
            # runtime code (.dependency-cruiser.cjs).
            - run: bun run knip
            - run: bun run jscpd
            - run: bun run depcruise
            # Payload's CLI runs on Node (its tsx loader hooks do not work under
            # Bun); 26 matches the runner image in the Dockerfile.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            # Fails when a collection or a Payload upgrade changes the schema
            # without a committed migration: production never pushes schema, so
            # that change would otherwise reach the live database only as errors.
            - run: bun run migrate:check
            # The generated types and admin import map are committed; a config
            # change that forgets to regenerate them fails here instead of
            # typechecking against a stale schema or losing an admin component.
            - name: Generated Payload files are up to date
              env:
                  NODE_ENV: production
                  PAYLOAD_SECRET: ci-generate
              run: |
                  bun run generate:types
                  bun run generate:importmap
                  git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
            # Fails on any high or critical advisory (see README: Dependency audit).
            - run: bun run audit
            - name: gitleaks (full history)
              # gitleaks exits 0 when git cannot read the repository ("0 commits
              # scanned"), so the commit count is checked as well.
              run: |
                  out=$(docker run --rm -v "$PWD:/repo:ro" \
                      zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
                      git --redact --exit-code 1 /repo 2>&1) || { echo "$out"; exit 1; }
                  echo "$out"
                  echo "$out" | grep -Eq '(^|[^0-9])[1-9][0-9]* commits scanned' || { echo '::error::gitleaks scanned no commits'; exit 1; }
            - name: Trivy (dependencies, secrets, misconfiguration)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  severity: HIGH,CRITICAL
                  skip-dirs: node_modules
                  exit-code: '1'
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

    image:
        needs: check
        if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  # `candidate` is what docker-compose.yml runs below (IMAGE_TAG);
                  # the full commit SHA is what deploy and rollback address.
                  tags: |
                      type=raw,value=candidate
                      type=sha,format=long,prefix=
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            # The Dockerfile migrates an empty database and runs `next build`
            # against it: no live data reaches the runner. Pull requests build
            # with Cloudflare's always-pass Turnstile test key; a release with
            # the real one.
            - name: Build candidate
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  load: true
                  push: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ github.event_name == 'pull_request' && '1x00000000000000000000AA' || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                      NEXT_PUBLIC_SITE_URL=${{ github.event_name == 'pull_request' && 'https://webgooh.tech' || secrets.NEXT_PUBLIC_SITE_URL }}
            - name: Scan the candidate for vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}:candidate
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'
            # The production compose file itself, so CI exercises the same
            # healthcheck (/api/health), memory limit and boot path the droplet
            # runs: an empty database that every migration is applied to at start.
            - name: Start candidate
              env:
                  IMAGE_TAG: candidate
                  HEALTH_REQUIRE_DATA: 'false'
                  DATA_DIR: ${{ runner.temp }}/data
                  IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache
                  PAYLOAD_SECRET: ci-smoke
                  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
                  S3_ACCESS_KEY_ID: ci-smoke
                  S3_SECRET_ACCESS_KEY: ci-smoke
              run: |
                  install -d -m 777 "$DATA_DIR" "$IMAGE_CACHE_DIR"
                  docker compose up -d --wait --wait-timeout 120 web
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - name: Smoke test
              run: bun scripts/smoke.ts http://127.0.0.1:3001
            - name: Candidate logs
              if: failure()
              env:
                  IMAGE_TAG: candidate
              run: docker compose logs web
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              if: github.ref == 'refs/heads/main'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Push the exact image that passed the smoke test, by SHA only: :latest
            # moves in deploy.yml after production reports healthy.
            - name: Push the SHA tag
              if: github.ref == 'refs/heads/main'
              run: docker push "$IMAGE:$GITHUB_SHA"
