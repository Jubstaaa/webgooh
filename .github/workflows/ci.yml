name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run type-check
            - run: bun run test
            # Payload's CLI runs on Node (its tsx loader hooks do not work under
            # Bun); 26 matches the runner image in the Dockerfile.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            # Fails when a collection or a Payload upgrade changes the schema
            # without a committed migration: production never pushes schema, so
            # that change would otherwise reach the live database only as errors.
            - run: bun run migrate:check
            # Fails on any high or critical advisory (see README: Dependency audit).
            - run: bun run audit
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
