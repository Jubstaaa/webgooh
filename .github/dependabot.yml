version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          # Payload's packages must move together: mixed versions break its types.
          payload:
              patterns: ['payload', '@payloadcms/*']
          next:
              patterns: ['next', '@next/*', 'eslint-config-next']
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          eslint:
              patterns: ['eslint', '@eslint/*']
      ignore:
          # `typescript` here is the alias for @typescript/typescript6 (the TS 6 API
          # that typescript-eslint and next build need); Dependabot would bump the
          # alias key to 7. TS 7 itself updates through `@typescript/native`.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # Payload declares graphql ^16 as a peer; take 17 once Payload supports it.
          - dependency-name: graphql
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
