version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          # Payload's packages must move together: mixed versions break its types.
          payload:
              patterns: ['payload', '@payloadcms/*']
          next:
              patterns: ['next', '@next/*', 'eslint-config-next']
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
          eslint:
              patterns: ['eslint', '@eslint/*']
      ignore:
          # typescript-eslint does not support TypeScript 7 yet.
          - dependency-name: typescript
            versions: ['>=7']
          # Must match the Node.js major the code runs on, not the newest one.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
